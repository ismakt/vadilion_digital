  <meta name="description" content="Vadilion Digital conçoit des solutions digitales uniques répondant à des besoins concrets : intelligence territoriale, commande en ligne, présence locale et développement sur mesure." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Vadilion Digital" />
  <meta property="og:description" content="Des solutions digitales uniques, répondant à des besoins concrets, à partir de données à forte valeur ajoutée." />
  <meta property="og:url" content="https://vadiliondigital.be/" />
  <meta property="og:image" content="https://vadiliondigital.be/images/vadiliondigital_logo.png" />

  <link rel="canonical" href="https://vadiliondigital.be/" />

<body>

<!-- ═══════════════ HEADER ═══════════════ -->
<header>
  
  <!--

  <div class="lang">
    <span class="active" id="fr-btn" role="button" tabindex="0">FR</span>
    <span class="sep" aria-hidden="true">|</span>
    <span id="en-btn" role="button" tabindex="0">EN</span>
  </div>
</header>

<!-- ═══════════════ MAIN ═══════════════ -->
<main id="main-content">
  <div id="vanta-bg" aria-hidden="true"></div>

  <!-- Navigation menu -->
  <nav class="menu" aria-label="Sections">
    <button id="menu-about" aria-controls="about" aria-expanded="false">À PROPOS</button>
    <button id="menu-solutions" aria-controls="solutions" aria-expanded="false">SOLUTIONS</button>
  </nav>

  <!-- About panel -->
  <section class="panel" id="about">
    <p id="about-text">
      Nous développons des solutions digitales uniques, répondant à des besoins
      concrets, à partir de données à forte valeur ajoutée.
    </p>
  </section>

  <!-- Solutions panel — contenu injecté depuis assets/js/solutions.js -->
  <section class="panel panel-wide" id="solutions">
    <div class="sol-layout">
      <div class="sol-nav" id="sol-nav"></div>
      <div class="sol-detail-pane" id="sol-detail-pane"></div>
    </div>
  </section>
</main>

<!-- ═══════════════ FOOTER ═══════════════ -->
<footer>
  <div class="footer-line"></div>
  <div class="footer-content">
    <button type="button" id="offices-link" onclick="openModal('officeModal')">Bureaux</button>
    <button type="button" id="contact-footer-link" onclick="openModal('contactModal')">Contact</button>
    <button type="button" id="media-link" onclick="openModal('mediaModal')">Media</button>
  </div>
</footer>

<!-- ═══════════════ MODAL — CONTACT ═══════════════ -->
<div class="modal" id="contactModal" role="dialog" aria-modal="true" aria-labelledby="contact-text">
  <div class="modal-content">
    <button class="close" onclick="closeModal('contactModal')" aria-label="Fermer">✕</button>
    <h4 id="contact-text">Contactez-nous</h4>
    <p id="contact-text2">Comment pouvons nous vous aider ?
    </p>
    <input  id="contact-name"    placeholder="Nom"                    autocomplete="name"  required />
    <input  id="contact-info"    placeholder="Coordonnées de contact"  autocomplete="email" required />
    <textarea id="contact-message" placeholder="Comment pouvons-nous vous aider ?"
              maxlength="999" required></textarea>
    <button id="btn-send" class="btn-modal-send">Envoyer</button>
  </div>
</div>
